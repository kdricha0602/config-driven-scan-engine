# Render blueprint — Tier 1 (primary).
# Deploys the PREBUILT image from GHCR (built by .github/workflows/
# build-tier-image.yml). Render only pulls and starts it — no more
# 15-minute free-tier builds blowing the deploy health-check window.
# Set env vars in the Render dashboard (never in this file):
#   TIER_NAME=render  DATABASE_URL=<supabase pooled URL>  WATCHDOG_SECRET=<secret>
services:
  - type: web
    name: scan-tier-render
    runtime: image
    image:
      url: ghcr.io/kdricha0602/scan-tier:latest
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: TIER_NAME
        value: render
      - key: TEMPORAL_ADDRESS
        value: localhost:7233
      - key: PORT
        value: 8000
