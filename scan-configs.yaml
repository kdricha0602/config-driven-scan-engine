# Scan configurations — 2026-09-19 (Korben's design)

# Architecture: Temporal orchestrates the scan; Activities fetch market data, SEC filings,
# news, and compute technical/financial values; LiteLLM handles catalyst interpretation,
# financial-language analysis, thesis contradiction, and final synthesis. The scan config
# determines what a given scan cares about. Final synthesis produces the Top 3-5 WITHOUT
# forcing a candidate into the list merely to fill the quota.

# Engine-wide output rules. These apply to EVERY scan and are enforced by the
# deterministic quality_control activity — the LLM synthesis cannot override
# them, and a violating pick is dropped, never silently fixed.
engine_rules:
  mega_cap:
    # A mega-cap (market cap at/above threshold) priced OVER price_cap is
    # never emitted in any scan result.
    threshold: 200B
    price_cap: 35
    # A mega-cap at/under price_cap may appear only if it satisfies at
    # least this fraction of the scan's hard criteria.
    min_criteria_fraction: 0.8

  limits:
    # Max concurrent per-ticker child workflows. An unbounded fan-out over a
    # full universe is a self-DoS (history bloat, rate limits, runaway LLM
    # cost); tickers are processed in chunks of this size.
    max_concurrent_tickers: 25
    # Hard ceiling on universe size. A larger universe fails closed with a
    # clear error instead of running away — raise explicitly to allow more.
    max_tickers: 5000

scans:
  - scan:
      name: "Micro Cap Momentum"

      universe:
        market_cap:
          min: 30M
          max: 1B

      hard_filters:
        price:
          min: 2
          max: 20

        float:
          max: 10M

        relative_volume:
          min: 3

        daily_move:
          min: 10%

        volume:
          min: 500000

        catalyst_age:
          max_days: 7

  # TEMPORARY deterministic mode (2026-09-24): no LLM_API_KEY on the tier yet,
  # so the three LiteLLM activities are off. Scans run the full deterministic
  # pipeline (universe, technicals, fundamentals, valuation, QC) and complete
  # with real picks. Re-enable when a key is set on the tier.
      analytics:
        technicals: true
        catalyst_quality: false
        dilution: true
        relative_strength: true
        fundamentals: true
        valuation: true
        thesis_contradiction: false
        data_confidence: true
        synthesis: false

      output:
        top_candidates: 5
        watchlist: 5

  - scan:
      name: "Large Cap Compounders"

      universe:
        market_cap:
          min: 10B

      hard_filters:
        roic:
          min: 14%

        revenue_cagr:
          min: 9%

        eps_cagr:
          min: 9%

        fcf:
          positive_years: 3
          margin_min: 6%

        net_debt_ebitda:
          max: 2.75

        ebit_interest:
          min: 3.5

        valuation:
          ev_ebitda_max: 15
          fcf_yield_min: 4%

        gate7:
          require_pass: true

      analytics:
        technicals: true
        catalyst_quality: false
        dilution: true
        relative_strength: true
        fundamentals: true
        valuation: true
        thesis_contradiction: false
        data_confidence: true
        synthesis: false

      output:
        top_candidates: 5

  - scan:
      name: "Small Cap 4x Growth"

      # No market-cap filter (Korben 2026-09-23 revision): the $2-$25 price
      # band plus a liquidity-ranked candidate cap define the universe.
      universe:
        max_candidates: 1200

      hard_filters:
        price:
          min: 2
          max: 25

        above_200dma:
          require: true

        revenue_yoy:
          min: 30%

        eps_growth:
          min: 25%

        current_ratio:
          min: 1.5

        debt_equity:
          max: 0.5

      analytics:
        technicals: true
        catalyst_quality: false
        relative_strength: true
        fundamentals: true
        forward_eps_growth: true
        thesis_contradiction: false
        data_confidence: true
        consensus_evidence: true
        synthesis: false

      output:
        top_candidates: 5
