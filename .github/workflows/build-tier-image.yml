# Build tier image — prebuilds the Docker image in GitHub Actions and pushes
# it to GHCR, so Render deploys a ready image instead of slow-building on
# its free tier (the 15-minute free-tier build kept exceeding Render's
# deploy health-check window, and no deploy ever succeeded).
#
# deploy/render.yaml points at ghcr.io/kdricha0602/scan-tier:latest.
# Render pulls the fresh image on blueprint sync / auto-deploy.
name: Build tier image

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'deploy/Dockerfile'
      - 'deploy/start.sh'
      - 'scan-configs.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kdricha0602/scan-tier

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
